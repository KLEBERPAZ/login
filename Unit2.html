<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMS · Gerenciar Motoristas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    h1 .destaque {
      color: #60a5fa;
    }

    .btn {
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover { background: #2563eb; }

    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }

    .btn-edit {
      background: #f59e0b;
      color: white;
    }
    .btn-edit:hover { background: #d97706; }

    .btn-secondary {
      background: #334155;
      color: white;
    }
    .btn-secondary:hover { background: #475569; }

    .btn-sm {
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
    }

    /* Tabela */
    .table-wrapper {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #0f172a;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr {
      border-top: 1px solid #334155;
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: #293548;
    }

    .empty {
      padding: 3rem;
      text-align: center;
      color: #64748b;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-ativo { background: #064e3b; color: #6ee7b7; }
    .badge-inativo { background: #7f1d1d; color: #fca5a5; }

    .actions { display: flex; gap: 0.5rem; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      border: 1px solid #334155;
    }

    .modal h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3b82f6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.5rem; }
      th, td { padding: 0.7rem 0.5rem; font-size: 0.85rem; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TMS · <span class="destaque">Motoristas</span></h1>
      <button class="btn btn-primary" onclick="abrirModal()">➕ Novo Motorista</button>
    </header>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>CNH</th>
            <th>Telefone</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Novo Motorista</h2>
      <form id="form-motorista" onsubmit="salvar(event)">
        <input type="hidden" id="motorista-id">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="nome" required placeholder="Ex: João da Silva">
        </div>
        <div class="form-group">
          <label>CNH</label>
          <input type="text" id="cnh" required placeholder="Ex: 12345678900">
        </div>
        <div class="form-group">
          <label>Telefone</label>
          <input type="text" id="telefone" required placeholder="(11) 99999-9999">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== Estado =====
    let motoristas = JSON.parse(localStorage.getItem('tms_motoristas')) || [];
    let editandoId = null;

    // ===== Persistência =====
    function persistir() {
      localStorage.setItem('tms_motoristas', JSON.stringify(motoristas));
    }

    // ===== Render =====
    function render() {
      const tbody = document.getElementById('tabela-body');

      if (motoristas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty">Nenhum motorista cadastrado ainda. Clique em "Novo Motorista" para começar.</td></tr>`;
        return;
      }

      tbody.innerHTML = motoristas.map(m => `
        <tr>
          <td>${escapeHtml(m.nome)}</td>
          <td>${escapeHtml(m.cnh)}</td>
          <td>${escapeHtml(m.telefone)}</td>
          <td>
            <span class="badge ${m.status === 'Ativo' ? 'badge-ativo' : 'badge-inativo'}">
              ${m.status}
            </span>
          </td>
          <td>
            <div class="actions">
              <button class="btn btn-edit btn-sm" onclick="editar(${m.id})">✏️ Editar</button>
              <button class="btn btn-danger btn-sm" onclick="excluir(${m.id})">🗑️ Excluir</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // ===== Modal =====
    function abrirModal(motorista = null) {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');

      if (motorista) {
        title.textContent = 'Editar Motorista';
        document.getElementById('motorista-id').value = motorista.id;
        document.getElementById('nome').value = motorista.nome;
        document.getElementById('cnh').value = motorista.cnh;
        document.getElementById('telefone').value = motorista.telefone;
        document.getElementById('status').value = motorista.status;
        editandoId = motorista.id;
      } else {
        title.textContent = 'Novo Motorista';
        document.getElementById('form-motorista').reset();
        document.getElementById('motorista-id').value = '';
        editandoId = null;
      }

      modal.classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('form-motorista').reset();
      editandoId = null;
    }

    // ===== Criar / Atualizar =====
    function salvar(event) {
      event.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const cnh = document.getElementById('cnh').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const status = document.getElementById('status').value;

      if (!nome || !cnh || !telefone) return;

      if (editandoId) {
        // UPDATE
        motoristas = motoristas.map(m =>
          m.id === editandoId ? { ...m, nome, cnh, telefone, status } : m
        );
      } else {
        // CREATE
        const novo = {
          id: Date.now(),
          nome,
          cnh,
          telefone,
          status
        };
        motoristas.push(novo);
      }

      persistir();
      render();
      fecharModal();
    }

    // ===== Editar =====
    function editar(id) {
      const motorista = motoristas.find(m => m.id === id);
      if (motorista) abrirModal(motorista);
    }

    // ===== Excluir =====
    function excluir(id) {
      const motorista = motoristas.find(m => m.id === id);
      if (!motorista) return;

      if (confirm(`Deseja realmente excluir o motorista "${motorista.nome}"?`)) {
        motoristas = motoristas.filter(m => m.id !== id);
        persistir();
        render();
      }
    }

    // ===== Utilidades =====
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===== Init =====
    render();
  </script>
</body>
</html>
