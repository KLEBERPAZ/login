<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE · Gerenciar Alunos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    h1 .destaque {
      color: #60a5fa;
    }

    .btn {
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }

    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }

    .btn-edit { background: #f59e0b; color: white; }
    .btn-edit:hover { background: #d97706; }

    .btn-secondary { background: #334155; color: white; }
    .btn-secondary:hover { background: #475569; }

    .btn-print { background: #10b981; color: white; }
    .btn-print:hover { background: #059669; }

    .btn-sm {
      padding: 0.4rem 0.7rem;
      font-size: 0.85rem;
    }

    /* Tabela */
    .table-wrapper {
      background: #1e293b;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
    }

    thead { background: #0f172a; }

    th, td {
      padding: 1rem;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr {
      border-top: 1px solid #334155;
      transition: background 0.2s;
    }

    tbody tr:hover { background: #293548; }

    .empty {
      padding: 3rem;
      text-align: center;
      color: #64748b;
    }

    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    /* Avatar */
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #334155;
      display: block;
    }

    .avatar-initials {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      border: 2px solid #334155;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 500px;
      border: 1px solid #334155;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus { border-color: #3b82f6; }

    /* Upload de foto */
    .foto-upload {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .foto-preview {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px dashed #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      color: #64748b;
      font-size: 1.5rem;
    }

    .foto-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-upload-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .foto-upload-actions label { margin-bottom: 0; }
    .foto-upload-actions input[type="file"] { display: none; }

    .btn-upload {
      background: #334155;
      color: white;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-upload:hover { background: #475569; }

    .btn-remover-foto {
      background: transparent;
      color: #fca5a5;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      padding: 0.2rem 0;
    }

    .btn-remover-foto:hover { text-decoration: underline; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 640px) {
      h1 { font-size: 1.5rem; }
      th, td { padding: 0.7rem 0.5rem; font-size: 0.85rem; }
      .actions { flex-direction: column; }
    }

    /* ===== CSS de impressão ===== */
    @media print {
      @page {
        size: A4 landscape; /* Melhor para caber mais colunas */
        margin: 1cm;
      }

      body {
        background: white !important;
        color: #111 !important;
        padding: 0 !important;
      }

      .container { max-width: 100%; }

      header {
        display: block;
        margin-bottom: 1rem;
        border-bottom: 2px solid #111;
        padding-bottom: 0.75rem;
      }

      h1 {
        font-size: 1.4rem;
        color: #111 !important;
        margin-bottom: 0.25rem;
      }

      h1 .destaque { color: #2563eb !important; }

      .header-actions,
      .actions,
      .btn { display: none !important; }

      .print-info {
        display: block !important;
        font-size: 0.8rem;
        color: #555;
        margin-top: 0.5rem;
      }

      .table-wrapper {
        background: white !important;
        border: 1px solid #999 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
      }

      table { width: 100%; }

      thead { background: #f1f5f9 !important; }

      th, td {
        color: #111 !important;
        border: 1px solid #ccc !important;
        padding: 0.5rem !important;
        font-size: 0.8rem !important;
        white-space: normal;
      }

      th {
        background: #e2e8f0 !important;
        font-size: 0.75rem !important;
      }

      tbody tr:hover { background: transparent !important; }

      .avatar {
        width: 36px !important;
        height: 36px !important;
        border: 1px solid #999 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .avatar-initials {
        width: 36px !important;
        height: 36px !important;
        font-size: 0.75rem !important;
        border: 1px solid #999 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .empty { color: #555 !important; }

      /* Esconde coluna de ações na impressão */
      th:last-child,
      td:last-child { display: none !important; }

      .print-footer {
        display: block !important;
        margin-top: 1.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid #999;
        font-size: 0.75rem;
        color: #555;
        text-align: center;
      }
    }

    .print-info,
    .print-footer { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SGE · <span class="destaque">Alunos</span></h1>
      <div class="header-actions">
        <button class="btn btn-print" onclick="imprimirTodos()">🖨️ Imprimir PDF</button>
        <button class="btn btn-primary" onclick="abrirModal()">➕ Novo Aluno</button>
      </div>
      <div class="print-info" id="print-info"></div>
    </header>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Nome Completo</th>
            <th>Matrícula SGE</th>
            <th>Nascimento</th>
            <th>Filiação 1</th>
            <th>Filiação 2</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>

    <div class="print-footer" id="print-footer">
      Documento gerado pelo SGE · Gerenciar Alunos
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2 id="modal-title">Novo Aluno</h2>
      <form id="form-aluno" onsubmit="salvar(event)">
        <input type="hidden" id="aluno-id">
        <input type="hidden" id="foto-base64">

        <div class="form-group">
          <label>Foto do Aluno</label>
          <div class="foto-upload">
            <div class="foto-preview" id="foto-preview">👤</div>
            <div class="foto-upload-actions">
              <label for="foto-input" class="btn-upload">📷 Escolher foto</label>
              <input type="file" id="foto-input" accept="image/*" onchange="processarFoto(event)">
              <button type="button" class="btn-remover-foto" id="btn-remover-foto" onclick="removerFoto()" style="display:none;">Remover foto</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="nome" placeholder="Ex: Maria Oliveira">
        </div>
        <div class="form-group">
          <label>Matrícula SGE</label>
          <input type="text" id="matricula" placeholder="Ex: 2024001">
        </div>
        <div class="form-group">
          <label>Data de Nascimento</label>
          <input type="date" id="dataNascimento">
        </div>
        <div class="form-group">
          <label>Filiação 1 (Mãe)</label>
          <input type="text" id="filiacao1" placeholder="Nome da mãe">
        </div>
        <div class="form-group">
          <label>Filiação 2 (Pai)</label>
          <input type="text" id="filiacao2" placeholder="Nome do pai (opcional)">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== Estado =====
    let alunos = JSON.parse(localStorage.getItem('sge_alunos')) || [];
    let editandoId = null;
    let filtroImpressao = null;

    // ===== Persistência =====
    function persistir() {
      try {
        localStorage.setItem('sge_alunos', JSON.stringify(alunos));
      } catch (e) {
        alert('Não foi possível salvar. As fotos podem estar ocupando muito espaço do localStorage. Tente fotos menores.');
      }
    }

    // ===== Render Tabela =====
    function render() {
      const tbody = document.getElementById('tabela-body');
      const lista = filtroImpressao
        ? alunos.filter(a => a.id === filtroImpressao)
        : alunos;

      if (lista.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">Nenhum aluno cadastrado ainda. Clique em "Novo Aluno" para começar.</td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map(a => `
        <tr>
          <td>${renderAvatar(a)}</td>
          <td>${escapeHtml(a.nome) || 'Sem nome'}</td>
          <td>${escapeHtml(a.matricula) || '-'}</td>
          <td>${a.dataNascimento ? formatarData(a.dataNascimento) : '-'}</td>
          <td>${escapeHtml(a.filiacao1) || '-'}</td>
          <td>${escapeHtml(a.filiacao2) || '-'}</td>
          <td>
            <div class="actions">
              <button class="btn btn-edit btn-sm" onclick="editar(${a.id})">✏️ Editar</button>
              <button class="btn btn-danger btn-sm" onclick="excluir(${a.id})">🗑️ Excluir</button>
              <button class="btn btn-print btn-sm" onclick="imprimirUm(${a.id})" title="Imprimir apenas este registro">🖨️ PDF</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderAvatar(a) {
      if (a.foto) {
        return `<img src="${a.foto}" alt="Foto de ${escapeHtml(a.nome)}" class="avatar">`;
      }
      const iniciais = getIniciais(a.nome || '?');
      const cor = corPorNome(a.nome || '?');
      return `<div class="avatar-initials" style="background:${cor}">${iniciais}</div>`;
    }

    function getIniciais(nome) {
      const partes = String(nome).trim().split(/\s+/);
      if (partes.length === 1) return partes[0].substring(0, 2).toUpperCase();
      return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
    }

    function corPorNome(nome) {
      let hash = 0;
      for (let i = 0; i < nome.length; i++) hash = nome.charCodeAt(i) + ((hash << 5) - hash);
      const cores = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#ef4444', '#06b6d4'];
      return cores[Math.abs(hash) % cores.length];
    }

    function formatarData(dataString) {
      if (!dataString) return '-';
      const [ano, mes, dia] = dataString.split('-');
      return `${dia}/${mes}/${ano}`;
    }

    // ===== Modal =====
    function abrirModal(aluno = null) {
      const modal = document.getElementById('modal');
      const title = document.getElementById('modal-title');

      if (aluno) {
        title.textContent = 'Editar Aluno';
        document.getElementById('aluno-id').value = aluno.id;
        document.getElementById('nome').value = aluno.nome || '';
        document.getElementById('matricula').value = aluno.matricula || '';
        document.getElementById('dataNascimento').value = aluno.dataNascimento || '';
        document.getElementById('filiacao1').value = aluno.filiacao1 || '';
        document.getElementById('filiacao2').value = aluno.filiacao2 || '';
        document.getElementById('foto-base64').value = aluno.foto || '';
        atualizarPreview(aluno.foto || null);
        editandoId = aluno.id;
      } else {
        title.textContent = 'Novo Aluno';
        document.getElementById('form-aluno').reset();
        document.getElementById('aluno-id').value = '';
        document.getElementById('foto-base64').value = '';
        atualizarPreview(null);
        editandoId = null;
      }

      modal.classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('form-aluno').reset();
      document.getElementById('foto-base64').value = '';
      atualizarPreview(null);
      editandoId = null;
    }

    // ===== Foto =====
    function processarFoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('Por favor, selecione um arquivo de imagem.');
        event.target.value = '';
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        alert('A imagem é muito grande. Escolha uma foto com até 2MB.');
        event.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result;
        document.getElementById('foto-base64').value = base64;
        atualizarPreview(base64);
      };
      reader.readAsDataURL(file);
    }

    function atualizarPreview(base64) {
      const preview = document.getElementById('foto-preview');
      const btnRemover = document.getElementById('btn-remover-foto');

      if (base64) {
        preview.innerHTML = `<img src="${base64}" alt="Pré-visualização">`;
        btnRemover.style.display = 'block';
      } else {
        preview.innerHTML = '👤';
        btnRemover.style.display = 'none';
      }
    }

    function removerFoto() {
      document.getElementById('foto-base64').value = '';
      document.getElementById('foto-input').value = '';
      atualizarPreview(null);
    }

    // ===== Criar / Atualizar (Sem obrigatoriedade) =====
    function salvar(event) {
      event.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const matricula = document.getElementById('matricula').value.trim();
      const dataNascimento = document.getElementById('dataNascimento').value;
      const filiacao1 = document.getElementById('filiacao1').value.trim();
      const filiacao2 = document.getElementById('filiacao2').value.trim();
      const foto = document.getElementById('foto-base64').value;

      if (editandoId) {
        alunos = alunos.map(a =>
          a.id === editandoId ? { ...a, nome, matricula, dataNascimento, filiacao1, filiacao2, foto } : a
        );
      } else {
        const novo = {
          id: Date.now(),
          nome,
          matricula,
          dataNascimento,
          filiacao1,
          filiacao2,
          foto
        };
        alunos.push(novo);
      }

      persistir();
      render();
      fecharModal();
    }

    // ===== Editar =====
    function editar(id) {
      const aluno = alunos.find(a => a.id === id);
      if (aluno) abrirModal(aluno);
    }

    // ===== Excluir =====
    function excluir(id) {
      const aluno = alunos.find(a => a.id === id);
      if (!aluno) return;

      if (confirm(`Deseja realmente excluir o aluno "${aluno.nome || 'Sem nome'}"?`)) {
        alunos = alunos.filter(a => a.id !== id);
        persistir();
        render();
      }
    }

    // ===== Impressão / PDF =====
    function imprimirTodos() {
      if (alunos.length === 0) {
        alert('Não há alunos cadastrados para imprimir.');
        return;
      }
      filtroImpressao = null;
      prepararImpressao('Relatório de Alunos · Todos os registros');
      window.print();
      finalizarImpressao();
    }

    function imprimirUm(id) {
      const aluno = alunos.find(a => a.id === id);
      if (!aluno) return;

      filtroImpressao = id;
      prepararImpressao(`Relatório de Aluno · ${aluno.nome || 'Sem nome'}`);
      render();
      window.print();
      finalizarImpressao();
    }

    function prepararImpressao(titulo) {
      const agora = new Date();
      const dataHora = agora.toLocaleString('pt-BR');
      const info = document.getElementById('print-info');
      info.textContent = `${titulo} — Gerado em ${dataHora}`;

      const footer = document.getElementById('print-footer');
      footer.textContent = `Documento gerado pelo SGE · Gerenciar Alunos — ${dataHora}`;
    }

    function finalizarImpressao() {
      const info = document.getElementById('print-info');
      info.textContent = '';

      if (filtroImpressao !== null) {
        filtroImpressao = null;
        render();
      }
    }

    // ===== Utilidades =====
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ===== Init =====
    render();
  </script>
</body>
</html>
