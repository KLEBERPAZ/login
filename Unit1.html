<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · TMS Web Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      padding: 1rem;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem 2rem;
      transition: transform 0.2s ease;
    }

    .login-card:hover { transform: scale(1.01); }

    .brand { text-align: center; margin-bottom: 2rem; }

    .brand-icon {
      width: 56px; height: 56px;
      background: #2563eb; border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.4);
    }

    .brand-icon svg {
      width: 28px; height: 28px;
      stroke: white; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .brand h1 {
      font-size: 1.8rem; font-weight: 700;
      letter-spacing: -0.02em; color: #0f172a; margin-bottom: 0.25rem;
    }

    .brand p { color: #64748b; font-size: 0.95rem; font-weight: 400; }

    .login-form { display: flex; flex-direction: column; gap: 1.25rem; }

    .input-group { display: flex; flex-direction: column; gap: 0.4rem; }

    .input-group label {
      font-size: 0.875rem; font-weight: 600; color: #1e293b;
      display: flex; align-items: center; gap: 0.25rem;
    }

    .input-group label span { color: #ef4444; font-size: 1rem; }

    .input-wrapper { position: relative; display: flex; align-items: center; }

    .input-wrapper > svg {
      position: absolute; left: 1rem;
      width: 18px; height: 18px;
      stroke: #94a3b8; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: stroke 0.2s; pointer-events: none;
    }

    .input-wrapper input {
      width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem;
      border: 1.5px solid #e2e8f0; border-radius: 14px;
      font-size: 1rem; color: #0f172a; background: white;
      transition: border-color 0.2s, box-shadow 0.2s; outline: none;
    }

    .input-wrapper input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .input-wrapper input:focus ~ svg { stroke: #2563eb; }

    .toggle-password {
      position: absolute; right: 1rem;
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; color: #94a3b8; transition: color 0.2s;
    }

    .toggle-password:hover { color: #2563eb; }

    .toggle-password svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .options {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 0.25rem;
    }

    .checkbox-label {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.875rem; color: #334155;
      cursor: pointer; user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 1rem; height: 1rem;
      accent-color: #2563eb; cursor: pointer;
    }

    .forgot-link {
      font-size: 0.875rem; font-weight: 500;
      color: #2563eb; text-decoration: none;
    }

    .forgot-link:hover { text-decoration: underline; }

    .btn-login {
      background: #2563eb; color: white;
      border: none; border-radius: 14px;
      padding: 0.9rem; font-size: 1rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.5);
      margin-top: 0.25rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }

    .btn-login:hover { background: #1d4ed8; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }

    .error-message {
      color: #dc2626; font-size: 0.8rem;
      display: none; align-items: center; gap: 0.25rem;
    }

    .error-message.show { display: flex; }

    .input-wrapper input.error { border-color: #dc2626; }

    .input-wrapper input.error:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15);
    }

    .invalid-credentials {
      background: #fef2f2; border: 1px solid #fecaca;
      color: #b91c1c; padding: 0.75rem 1rem;
      border-radius: 12px; font-size: 0.875rem;
      display: none; align-items: center; gap: 0.5rem;
    }

    .invalid-credentials.show { display: flex; animation: shake 0.3s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem 1.5rem; border-radius: 1.75rem; }
      .brand h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" stroke="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
      </div>
      <h1>TMS Project</h1>
      <p>Acesse sua conta para continuar</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="invalid-credentials" id="invalidCredentials" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>Usuário ou senha incorretos. Tente novamente.</span>
      </div>

      <div class="input-group">
        <label for="username">Usuário <span>*</span></label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="Digite seu usuário" autocomplete="username" required>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div class="error-message" id="usernameError">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>Informe seu usuário.</span>
        </div>
      </div>

      <div class="input-group">
        <label for="password">Senha <span>*</span></label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" id="eyeIcon" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
        <div class="error-message" id="passwordError">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>Informe sua senha.</span>
        </div>
      </div>

      <div class="options">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" name="remember">
          Lembrar-me
        </label>
        <a href="#" class="forgot-link" id="forgotLink">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span>Entrar</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>
    </form>
  </div>

  <script>
    (function() {
      'use strict';

      // ====== CONFIGURAÇÃO ======
      const VALID_USERNAME = '123';
      const VALID_PASSWORD = '123';
      const REDIRECT_URL = 'Unit2.html';
      const STORAGE_KEY = 'tms_remember_credentials';
      // ==========================

      const form = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');
      const invalidCredentials = document.getElementById('invalidCredentials');
      const togglePasswordBtn = document.getElementById('togglePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      const loginBtn = document.getElementById('loginBtn');
      const forgotLink = document.getElementById('forgotLink');
      const rememberCheckbox = document.getElementById('remember');

      // ============================================================
      // 🔐 Restaura credenciais salvas ao carregar a página
      // ============================================================
      function carregarCredenciaisSalvas() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return;

          const creds = JSON.parse(saved);
          if (creds && creds.username) {
            usernameInput.value = creds.username;
            if (creds.password) {
              passwordInput.value = creds.password;
            }
            rememberCheckbox.checked = true;
          }
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // ============================================================
      // 💾 Salva ou remove credenciais conforme o checkbox
      // ============================================================
      function salvarCredenciais(username, password) {
        if (rememberCheckbox.checked) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            username: username,
            password: password
          }));
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // Se o usuário desmarcar "Lembrar-me", apaga imediatamente
      rememberCheckbox.addEventListener('change', function() {
        if (!this.checked) {
          localStorage.removeItem(STORAGE_KEY);
        }
      });

      // Mostrar/ocultar senha
      togglePasswordBtn.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        if (type === 'text') {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          `;
          togglePasswordBtn.setAttribute('aria-label', 'Ocultar senha');
        } else {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          `;
          togglePasswordBtn.setAttribute('aria-label', 'Mostrar senha');
        }
      });

      // Limpar erros ao digitar
      usernameInput.addEventListener('input', () => {
        usernameInput.classList.remove('error');
        usernameError.classList.remove('show');
        invalidCredentials.classList.remove('show');
      });

      passwordInput.addEventListener('input', () => {
        passwordInput.classList.remove('error');
        passwordError.classList.remove('show');
        invalidCredentials.classList.remove('show');
      });

      function validateFields() {
        let isValid = true;

        if (!usernameInput.value.trim()) {
          usernameInput.classList.add('error');
          usernameError.classList.add('show');
          isValid = false;
        }

        if (!passwordInput.value) {
          passwordInput.classList.add('error');
          passwordError.classList.add('show');
          isValid = false;
        }

        return isValid;
      }

      form.addEventListener('submit', function(event) {
        event.preventDefault();

        if (!validateFields()) return;

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (username === VALID_USERNAME && password === VALID_PASSWORD) {
          // ✅ Login correto
          loginBtn.disabled = true;
          loginBtn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
              <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
              <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" />
            </svg>
            <span>Entrando...</span>
          `;

          // 💾 Salva credenciais (só se "Lembrar-me" estiver marcado)
          salvarCredenciais(username, password);

          // Sessão do usuário logado
          sessionStorage.setItem('tms_user', username);

          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 600);
        } else {
          // ❌ Credenciais erradas
          invalidCredentials.classList.add('show');
          usernameInput.classList.add('error');
          passwordInput.classList.add('error');

          invalidCredentials.style.animation = 'none';
          void invalidCredentials.offsetWidth;
          invalidCredentials.style.animation = 'shake 0.3s ease';

          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Usuário: 123\nSenha: 123');
      });

      // 🔄 Inicialização
      carregarCredenciaisSalvas();

      if (!usernameInput.value) {
        usernameInput.focus();
      } else {
        passwordInput.focus();
      }
    })();
  </script>
</body>
</html>
